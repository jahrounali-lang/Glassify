name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore folder structure from flat file names
        run: |
          for f in *__*; do
            [ -e "$f" ] || continue
            p="${f//__//}"
            mkdir -p "$(dirname "$p")"
            mv "$f" "$p"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: grep -nE "^e: |What went wrong|error:|Could not|Unresolved|Execution failed" -A4 build.log | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassClock-debug
          path: app/build/outputs/apk/debug/*.apk

      # Uses your keystore if the secrets exist; otherwise a throwaway CI key (installable, not for Play Store)
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$K_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$K_PASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass android123 -keypass android123 \
              -alias ci -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LiquidGlassClock CI"
            echo "KEYSTORE_PASSWORD=android123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=ci" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android123" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain 2>&1 | tee release.log

      - name: Show release errors
        if: failure()
        run: grep -nE "^e: |What went wrong|error:|Could not|Unresolved|Execution failed" -A4 release.log | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassClock-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
